plugins {
    id 'base'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'net.minecraftforge.gradle' version '6.0.36' apply false
    id 'org.spongepowered.mixin' version '0.7.38' apply false
}

subprojects {
    version = rootProject.mod_version
    group = rootProject.mod_group_id
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def targetTasks = [
        [suffix: 'NeoForge1211', path: ':targets:neoforge-1.21.1', description: 'NeoForge 1.21.1'],
        [suffix: 'Forge1201', path: ':targets:forge-1.20.1', description: 'Forge 1.20.1']
]

// Gradle's unqualified task selector otherwise also picks identically named
// run tasks from every subproject. Keep the legacy root commands bound to the
// NeoForge baseline while fully-qualified/versioned Forge commands still work.
if (gradle.startParameter.currentDir.canonicalFile == rootProject.projectDir.canonicalFile) {
    ['runClient', 'runServer', 'runData'].each { taskName ->
        if (gradle.startParameter.taskNames.contains(taskName)) {
            gradle.startParameter.excludedTaskNames.add(
                    ":targets:forge-1.20.1:${taskName}".toString()
            )
        }
    }
}

targetTasks.each { target ->
    tasks.register("compile${target.suffix}") {
        group = 'economy system'
        description = "Compile the ${target.description} target."
        dependsOn("${target.path}:compileJava")
    }

    tasks.register("process${target.suffix}Resources") {
        group = 'economy system'
        description = "Process resources for the ${target.description} target."
        dependsOn("${target.path}:processResources")
    }

    tasks.register("build${target.suffix}") {
        group = 'economy system'
        description = "Build the ${target.description} target."
        dependsOn("${target.path}:build")
    }

    tasks.register("run${target.suffix}Client") {
        group = 'economy system'
        description = "Run the ${target.description} client."
        dependsOn("${target.path}:runClient")
    }

    tasks.register("run${target.suffix}Server") {
        group = 'economy system'
        description = "Run the ${target.description} dedicated server."
        dependsOn("${target.path}:runServer")
    }
}

tasks.register('runNeoForge1211ClientDev2') {
    group = 'economy system'
    description = 'Run the NeoForge 1.21.1 secondary development client.'
    dependsOn(':targets:neoforge-1.21.1:runClientDev2')
}

tasks.register('runNeoForge1211Data') {
    group = 'economy system'
    description = 'Run NeoForge 1.21.1 data generation.'
    dependsOn(':targets:neoforge-1.21.1:runData')
}

// Preserve the pre-Bridge developer commands as explicit NeoForge 1.21.1
// entry points. The versioned aliases above remain available for automation.
tasks.register('runClient') {
    group = 'economy system'
    description = 'Run the primary NeoForge 1.21.1 development client.'
    dependsOn(':targets:neoforge-1.21.1:runClient')
}

tasks.register('runServer') {
    group = 'economy system'
    description = 'Run the primary NeoForge 1.21.1 dedicated server.'
    dependsOn(':targets:neoforge-1.21.1:runServer')
}

tasks.register('runData') {
    group = 'economy system'
    description = 'Run primary NeoForge 1.21.1 data generation.'
    dependsOn(':targets:neoforge-1.21.1:runData')
}

tasks.register('runForge1201Data') {
    group = 'economy system'
    description = 'Run Forge 1.20.1 data generation.'
    dependsOn(':targets:forge-1.20.1:runData')
}

tasks.register('compileAllTargets') {
    group = 'build'
    description = 'Compile every supported loader and Minecraft target.'
    dependsOn(':targets:neoforge-1.21.1:compileJava', ':targets:forge-1.20.1:compileJava')
}

tasks.register('buildAllTargets') {
    group = 'build'
    description = 'Build every supported loader and Minecraft target.'
    dependsOn(':targets:neoforge-1.21.1:build', ':targets:forge-1.20.1:build')
}

tasks.named('build') {
    description = 'Build every supported EconomySystem target.'
    dependsOn('buildAllTargets')
}
