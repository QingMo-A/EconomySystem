plugins {
    id 'base'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'net.minecraftforge.gradle' version '6.0.36' apply false
    id 'org.spongepowered.mixin' version '0.7.38' apply false
}

// settings.gradle is the sole manifest parser and validator.  Every root build invocation must
// consume the normalized model it publishes rather than reopening the JSON or duplicating checks.
if (!gradle.ext.has('economyTargetManifest')) {
    throw new GradleException('Validated economy target manifest is unavailable')
}
def economyTargetManifest = gradle.ext.get('economyTargetManifest')
if (!(economyTargetManifest instanceof Map) || !(economyTargetManifest.targets instanceof List)
        || economyTargetManifest.targets.isEmpty()) {
    throw new GradleException('Validated economy target manifest is unavailable')
}
def targetProjects = economyTargetManifest.targets.collect { target ->
    [id: target.id, projectPath: target.projectPath, taskSuffix: target.taskSuffix,
     displayName: target.displayName, loader: target.loader,
     minecraftVersion: target.minecraftVersion, javaVersion: target.javaVersion,
     directory: target.directory]
}
def defaultTargetId = economyTargetManifest.defaultTarget?.toString()?.trim()
def defaultTarget = targetProjects.find { it.id == defaultTargetId }
if (defaultTarget == null) {
    throw new GradleException('Validated economy target manifest is unavailable')
}

subprojects {
    version = rootProject.mod_version
    group = rootProject.mod_group_id
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Gradle's unqualified task selector otherwise also picks identically named run tasks from every
// subproject. Keep the legacy root commands bound to the manifest default target while the
// versioned aliases remain available for every target.
if (gradle.startParameter.currentDir.canonicalFile == rootProject.projectDir.canonicalFile) {
    ['runClient', 'runServer', 'runData'].each { taskName ->
        if (gradle.startParameter.taskNames.contains(taskName)) {
            targetProjects.findAll { it.id != defaultTarget.id }.each { target ->
                gradle.startParameter.excludedTaskNames.add(
                    "${target.projectPath}:${taskName}".toString()
                )
            }
        }
    }
}

def targetLifecycle = { Map target, String taskName -> "${target.projectPath}:${taskName}".toString() }

def registerTargetAlias = { Map target, String taskPrefix, String taskName, String description ->
    tasks.register("${taskPrefix}${target.taskSuffix}") {
        group = 'economy system'
        description = "${description} ${target.displayName} target."
        dependsOn(targetLifecycle(target, taskName))
    }
}

targetProjects.each { target ->
    registerTargetAlias(target, 'compile', 'compileJava', 'Compile the')
    tasks.register("process${target.taskSuffix}Resources") {
        group = 'economy system'
        description = "Process resources for the ${target.displayName} target."
        dependsOn(targetLifecycle(target, 'processResources'))
    }
    registerTargetAlias(target, 'test', 'test', 'Test the')
    registerTargetAlias(target, 'build', 'build', 'Build the')
    tasks.register("run${target.taskSuffix}Client") {
        group = 'economy system'
        description = "Run the ${target.displayName} client."
        dependsOn(targetLifecycle(target, 'runClient'))
    }
    tasks.register("run${target.taskSuffix}Server") {
        group = 'economy system'
        description = "Run the ${target.displayName} dedicated server."
        dependsOn(targetLifecycle(target, 'runServer'))
    }
    tasks.register("run${target.taskSuffix}Data") {
        group = 'economy system'
        description = "Run ${target.displayName} data generation."
        dependsOn(targetLifecycle(target, 'runData'))
    }
}

// Preserve the one explicit secondary-development command when the manifest contains the matching
// target.  This compatibility alias is optional and must never constrain manifest membership.
def neoForgeTarget = targetProjects.find { it.id == 'neoforge-1.21.1' }
if (neoForgeTarget != null) {
    tasks.register('runNeoForge1211ClientDev2') {
        group = 'economy system'
        description = 'Run the NeoForge 1.21.1 secondary development client.'
        dependsOn(targetLifecycle(neoForgeTarget, 'runClientDev2'))
    }
}

def registerDefaultRunAlias = { String alias, String targetTask, String aliasDescription ->
    tasks.register(alias) {
        group = 'economy system'
        description = aliasDescription
        dependsOn(targetLifecycle(defaultTarget, targetTask))
    }
}
registerDefaultRunAlias('runClient', 'runClient', 'Run the primary manifest-default development client.')
registerDefaultRunAlias('runServer', 'runServer', 'Run the primary manifest-default dedicated server.')
registerDefaultRunAlias('runData', 'runData', 'Run manifest-default data generation.')

def targetDependencies = { String taskName ->
    targetProjects.collect { targetLifecycle(it, taskName) }
}

tasks.register('compileAllTargets') {
    group = 'economy system'
    description = 'Compile every supported loader and Minecraft target.'
    dependsOn(targetDependencies('compileJava'))
}

tasks.register('testAllTargets') {
    group = 'economy system'
    description = 'Test every supported loader and Minecraft target.'
    dependsOn(targetDependencies('test'))
}

tasks.register('buildAllTargets') {
    group = 'economy system'
    description = 'Build every supported loader and Minecraft target.'
    dependsOn(targetDependencies('build'))
}

tasks.register('buildApiAllTargets') {
    group = 'economy system'
    description = 'Build API-only and API-sources jars for every supported EconomySystem target.'
    dependsOn(targetProjects.collectMany { target -> [
        targetLifecycle(target, 'apiJar'), targetLifecycle(target, 'apiSourcesJar')
    ] })
}

def requiredTargetLifecycleTasks = [
    'compileJava', 'processResources', 'test', 'build', 'runClient', 'runServer', 'runData'
].asImmutable()

tasks.register('validateTargetManifest') {
    group = 'economy system'
    description = 'Validate manifest target lifecycle tasks and root aliases.'
    doLast {
        targetProjects.each { target ->
            def targetProject = project(target.projectPath)
            requiredTargetLifecycleTasks.each { lifecycleTask ->
                if (targetProject.tasks.findByName(lifecycleTask) == null) {
                    throw new GradleException(
                        "Target ${target.id} is missing required lifecycle task ${lifecycleTask}")
                }
            }

            [
                "compile${target.taskSuffix}",
                "process${target.taskSuffix}Resources",
                "test${target.taskSuffix}",
                "build${target.taskSuffix}",
                "run${target.taskSuffix}Client",
                "run${target.taskSuffix}Server",
                "run${target.taskSuffix}Data"
            ].each { aliasTask ->
                if (rootProject.tasks.findByName(aliasTask) == null) {
                    throw new GradleException(
                        "Target ${target.id} is missing required alias task ${aliasTask}")
                }
            }
        }

        ['compileAllTargets', 'testAllTargets', 'buildAllTargets', 'verifyAllTargets'].each { aggregate ->
            if (rootProject.tasks.findByName(aggregate) == null) {
                throw new GradleException("Manifest aggregate task ${aggregate} is missing")
            }
        }
    }
}

tasks.register('verifyAllTargets') {
    group = 'economy system'
    description = 'Test and build every supported loader and Minecraft target.'
    dependsOn('validateTargetManifest', 'testAllTargets', 'buildAllTargets')
}

tasks.named('build') {
    description = 'Build every supported EconomySystem target.'
    dependsOn('buildAllTargets')
}
