# tritium Configuration
# Generated by TritiumConfig
# Environment: client
# Client-only sections will not be generated on server side
# Edit this file and it will be automatically reloaded

[performance]
[performance.fastBambooLight]
## Bamboo Light
bambooLight = true



[rendering]
[rendering.cro]
## Chest_rendering_optimization
chest_rendering_optimization = false


[rendering.fastBlit]
## Fast Blit
fastBlit = true


[rendering.GpuPlus]
## Gpu Plus
gpuPlus = true

## Gpu Plus Vbo
gpuPlusVbo = true

## Gpu Plus Index
gpuPlusIndex = true


[rendering.reflex]
## Enable Reflex
enableReflex = true

## Reflex Debug
reflexDebug = false

## Reflex Offset Ns
reflexOffsetNs = 0

## M A X_ F P S
MAX_FPS = 0


[rendering.entityCulling]
## Enable Culling
enableCulling = true

## Enable Block Entity Culling
enableBlockEntityCulling = true

## Enable Tick Stopping
enableTickStopping = false

## Enable Name Tag Culling
enableNameTagCulling = true

## Entity Blacklist
entityBlacklist = ["minecraft:player", "minecraft:villager"]


[rendering.leafCulling]
## Enable Leaf Culling
enableLeafCulling = true

## Hide Inner Leaves
hideInnerLeaves = false

## Enable Face Occlusion Culling
enableFaceOcclusionCulling = true



[clientOptimizations]
[clientOptimizations.FL]
## Fast Language Switch
fastLanguageSwitch = true


[clientOptimizations.FastResourcePack]
## Resource Pack Cache
resourcePackCache = true


[clientOptimizations.dynamicFPS]
## Enable
enable = true

## Minimized F P S
minimizedFPS = 1



[network]

[entities]
[entities.entityOpt]
## Optimize Entities
optimizeEntities = true

## Tick Raiders In Raid
tickRaidersInRaid = true

## Ite
ite = true

## Horizontal Range
horizontalRange = 64

## Vertical Range
verticalRange = 32

## Entity Whitelist
entityWhitelist = ["minecraft:ender_dragon"]


[entities.entityStacking]
## Enable
enable = true

## Lock Maxed Stacks
lockMaxedStacks = true

## Show Stack Count
showStackCount = true

## Max Stack Size
maxStackSize = 0

## Merge Distance
mergeDistance = 1.5

## List Mode
listMode = 0

## Item List
itemList = ["minecraft:item"]



[techOptimizations]
## Lambda Event Listeners
lambdaEventListeners = true


[fixes]
[fixes.buttonFix]
## Button Fix
buttonFix = true


[fixes.noGLog]
## No G Log
noGLog = true


[fixes.memoryLeakFix]
## A E2 W T Lib Creative Tab Leak Fix
AE2WTLibCreativeTabLeakFix = true

## Screenshot Byte Buffer Leak Fix
ScreenshotByteBufferLeakFix = true



[serverPerformance]
[serverPerformance.noiseSamplingCache]
## Noise Sampling Cache
noiseSamplingCache = true


## Async World Save
asyncWorldSave = true

## Async World Save Timeout Seconds
asyncWorldSaveTimeoutSeconds = 30


